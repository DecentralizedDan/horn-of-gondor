name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            receiver/package-lock.json

      - name: Install cloud dependencies
        run: npm ci

      - name: Install receiver dependencies
        run: npm ci --prefix receiver

      - name: Verify project
        run: npm run check
